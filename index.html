<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Сухарики</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:dark;--bg:#080504;--fg:#f3e2c4;--ac:#e0a458;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;overflow:hidden}
#stage{position:relative;height:100%;display:flex;justify-content:center;align-items:center}
canvas{height:100%;max-width:100%;aspect-ratio:4/5;object-fit:contain;touch-action:manipulation}
#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 2px 12px #000}
#hud b{display:block;font-size:clamp(22px,4vw,34px);letter-spacing:.18em;text-transform:uppercase}
#count{font-size:15px;opacity:.85;letter-spacing:.1em}
#hint{position:absolute;top:30%;left:0;right:0;text-align:center;font-style:italic;opacity:.8;pointer-events:none;transition:opacity .6s;text-shadow:0 2px 10px #000;animation:p 2s infinite}
@keyframes p{50%{opacity:.35}}
#sub{position:absolute;left:5%;right:5%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);text-align:center;font-size:clamp(17px,2.6vw,24px);font-style:italic;opacity:0;transition:opacity .3s;text-shadow:0 2px 10px #000,0 0 4px #000;pointer-events:none}
#sub.on{opacity:1}
#intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(8,5,4,.82);backdrop-filter:blur(6px);text-align:center;padding:24px}
#intro h1{margin:0;font-size:clamp(40px,9vw,84px);letter-spacing:.2em;text-transform:uppercase;font-weight:400}
#intro p{margin:0;opacity:.8;max-width:420px;line-height:1.5}
button{font:inherit;font-size:18px;letter-spacing:.12em;text-transform:uppercase;color:#1a0f08;background:var(--ac);border:0;padding:14px 34px;border-radius:2px;cursor:pointer}
#again{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 70px)}
[hidden]{display:none!important}
</style></head><body>
<div id="stage">
<canvas id="c"></canvas>
<div id="hud"><b>Сухарики</b><span id="count">Рюмок: 0 / 20</span></div>
<div id="hint">Кликни по лицу деда</div>
<div id="sub"></div>
<button id="again" hidden>Разбудить и налить заново</button>
<div id="intro"><h1>Сухарики</h1><p>Кликай по лицу деда — он выпьет и закусит. Включи звук.</p><button id="go">Начать</button></div>
</div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d'),W=800,H=1000,R=1.5;
cv.width=W*R;cv.height=H*R;
const sm=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)},T=()=>performance.now()/1000,sleep=ms=>new Promise(r=>setTimeout(r,ms));

const PH=[["Ну, будем здоровы!","Между первой и второй — перерывчик небольшой.","Без хлеба не обедают, а без сухарика не закусывают.","Эх, хорошо пошла, зараза!","Жизнь прекрасна, пока рюмка не пуста."],
["Я, внучок, в молодости был — ого-го!","Одна голова хорошо, а с рюмкой веселее.","Закусываю, потому что уважаю.","Не пьянства ради, а здоровья для.","Сухарик — он как друг: хрустит, а не подведёт.","Старость — не радость, а сто грамм — всегда радость."],
["Ты чего, внучок, двоишься?","Давай ещё по одной... за... за что пили?","Я ж не пьяный... я просто задумчивый.","Хороший ты человек... хоть и двое вас.","Эх, раз... ещё раз... ещё много-много раз...","Мне бы только... прилечь... на минуточку."]];
let lastP='';
function phrase(){const d=S.shots/20,a=PH[d<.35?0:d<.7?1:2];let s;do{s=a[Math.random()*a.length|0]}while(s===lastP);return lastP=s}
/* ---------- аудио ---------- */
let AC,master,nb,snoreT;
function initAudio(){AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.85;master.connect(AC.destination);
const n=AC.sampleRate*2;nb=AC.createBuffer(1,n,AC.sampleRate);const d=nb.getChannelData(0);let l=0;for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
const s=AC.createBufferSource();s.buffer=nb;s.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=160;const g=AC.createGain();g.gain.value=.05;s.connect(f).connect(g).connect(master);s.start()}
function noise(t,dur,type,fr,q,vol,fe){const s=AC.createBufferSource();s.buffer=nb;s.playbackRate.value=.8+Math.random()*.4;const f=AC.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(fr,t);if(fe)f.frequency.exponentialRampToValueAtTime(fe,t+dur);f.Q.value=q;const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(master);s.start(t,Math.random(),dur+.05)}
function tone(t,f1,f2,dur,vol,type){const o=AC.createOscillator();o.type=type||'sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(master);o.start(t);o.stop(t+dur+.05)}
const sfx={
pour(){const t=AC.currentTime;noise(t,.9,'bandpass',1800,3,.22,3200);for(let i=0;i<6;i++)tone(t+i*.13,500+i*160,700+i*180,.08,.05)},
clink(){const t=AC.currentTime;[2400,3600,5100].forEach((f,i)=>tone(t,f,f*.995,.7-i*.15,.07/(i+1)))},
gulp(){const t=AC.currentTime;tone(t,180,90,.18,.4);tone(t+.3,200,80,.2,.35);noise(t,.15,'lowpass',500,1,.15)},
exhale(){noise(AC.currentTime,.6,'bandpass',900,.8,.12,400)},
crunch(){const t=AC.currentTime;for(let i=0;i<4;i++){noise(t+i*.07+Math.random()*.03,.06,'highpass',2500+Math.random()*2000,1,.3);noise(t+i*.07,.05,'bandpass',900,2,.2)}},
thud(){const t=AC.currentTime;tone(t,90,35,.5,.9);noise(t,.3,'lowpass',400,1,.6);tone(t+.05,2600,2500,.4,.05)},
scatter(){const t=AC.currentTime;for(let i=0;i<16;i++)noise(t+.05+Math.random()*.8,.04,'highpass',3000+Math.random()*3000,1,.1+Math.random()*.1)},
snore(){const t=AC.currentTime;noise(t,1.2,'lowpass',380,2,.35,200);const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=55;const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.5);g.gain.linearRampToValueAtTime(0,t+1.2);const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=250;o.connect(f).connect(g).connect(master);o.start(t);o.stop(t+1.3)}};
/* ---------- голос ---------- */
let voice=null;const hasS='speechSynthesis' in window;
function pickVoice(){const v=speechSynthesis.getVoices().filter(x=>/^ru/i.test(x.lang));voice=v.find(x=>/pavel|yuri|dmitri|maxim|male/i.test(x.name))||v[0]||null}
if(hasS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}

$('sub').textContent=text;$('sub').classList.add('on');S.talking=true;S.talkRate=rate;let done=false;

b.filter='blur(16px)';g=b.createLinearGradient(0,60,0,440);g.addColorStop(0,'#ffe0a8');g.addColorStop(1,'#d9944a');b.fillStyle=g;b.globalAlpha=.85;b.fillRect(40,70,230,370);b.fillStyle='#1d1109';b.fillRect(150,70,12,370);b.fillRect(40,235,230,10);

const stub=Array.from({length:420},()=>{const a=Math.random()*6.28,r=Math.sqrt(Math.random());return[Math.cos(a)*r*140,95+Math.abs(Math.sin(a))*r*140+Math.random()*10]});
const headP=new Path2D('M0 -235C150 -235 185 -80 178 40C170 150 110 235 0 240C-110 235 -170 150 -178 40C-185 -80 -150 -235 0 -235Z');
/* ---------- сухарики ---------- */
let cr=[];function initCr(){cr=[];for(let i=0;i<16;i++){const a=Math.random()*6.28,r=Math.sqrt(Math.random());cr.push({x:200+Math.cos(a)*r*105,y:898+Math.sin(a)*r*20,a:Math.random()*6,w:26+Math.random()*10,h:16+Math.random()*6,vx:0,vy:0,vr:0,fly:0,fy:0})}}initCr();
function crouton(x,y,a,w,h){ctx.save();ctx.translate(x,y);ctx.rotate(a);const g=ctx.createLinearGradient(0,-h/2,0,h/2);g.addColorStop(0,'#e3b26a');g.addColorStop(1,'#9c6128');ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,4);ctx.fill();ctx.fillStyle='rgba(255,230,170,.5)';for(let i=0;i<4;i++)ctx.fillRect(-w/2+4+i*(w/5),-h/2+3+(i%2)*5,2,2);ctx.strokeStyle='rgba(60,30,10,.5)';ctx.lineWidth=1;ctx.stroke();ctx.restore()}

/* ---------- рисование ---------- */
const L=(x1,y1,x2,y2)=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()};

ctx.fillStyle='rgba(200,225,235,.4)';ctx.fillRect(-18,-10,36,10);ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2;ctx.stroke(p);ctx.lineWidth=2;L(-15,-60,-12,-14);ctx.restore()}
function bottle(x,y,a,lvl){ctx.save();ctx.translate(x,y);ctx.rotate(a);const g=ctx.createLinearGradient(-30,0,30,0);g.addColorStop(0,'rgba(120,170,150,.9)');g.addColorStop(.35,'rgba(200,235,225,.9)');g.addColorStop(1,'rgba(60,100,90,.9)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-32,0);ctx.lineTo(-32,-150);ctx.quadraticCurveTo(-32,-185,-12,-205);ctx.lineTo(-12,-245);ctx.lineTo(12,-245);ctx.lineTo(12,-205);ctx.quadraticCurveTo(32,-185,32,-150);ctx.lineTo(32,0);ctx.closePath();ctx.fill();
ctx.fillStyle='#e9e1cf';ctx.fillRect(-32,-120,64,60);ctx.fillStyle='#b32a22';ctx.fillRect(-32,-100,64,20);ctx.fillStyle='#d6d6d6';ctx.fillRect(-13,-252,26,12);ctx.restore()}
function head(P){const{d,open,mo,T:t}=P;
for(const s of[-1,1]){ctx.fillStyle='#b9805f';ctx.beginPath();ctx.ellipse(s*176,30,26,48,s*.15,0,7);ctx.fill();ctx.strokeStyle='rgba(80,40,25,.5)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(s*178,30,12,28,s*.15,0,7);ctx.stroke()}
let g=ctx.createRadialGradient(-70,-110,20,0,0,270);g.addColorStop(0,'#e8c1a2');g.addColorStop(.55,'#c8946f');g.addColorStop(1,'#84543d');ctx.fillStyle=g;ctx.fill(headP);
ctx.save();ctx.clip(headP);g=ctx.createRadialGradient(-50,-200,5,-50,-190,90);g.addColorStop(0,'rgba(255,240,215,.55)');g.addColorStop(1,'rgba(255,240,215,0)');ctx.fillStyle=g;ctx.fillRect(-200,-250,300,200);
g=ctx.createLinearGradient(-180,0,180,0);g.addColorStop(0,'rgba(255,200,140,.12)');g.addColorStop(.5,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(25,8,0,.55)');ctx.fillStyle=g;ctx.fillRect(-200,-250,400,500);
for(const s of[-1,1]){g=ctx.createRadialGradient(s*105,70,5,s*105,70,75);g.addColorStop(0,`rgba(200,70,60,${.1+d*.38})`);g.addColorStop(1,'rgba(200,70,60,0)');ctx.fillStyle=g;ctx.fillRect(s*105-80,0,160,150)}
ctx.fillStyle='rgba(200,198,190,.5)';stub.forEach(p=>ctx.fillRect(p[0],p[1],1.6,1.6));
g=ctx.createLinearGradient(0,70,0,240);g.addColorStop(0,'rgba(170,170,165,0)');g.addColorStop(1,'rgba(170,170,165,.3)');ctx.fillStyle=g;ctx.fillRect(-200,70,400,180);ctx.restore();
ctx.lineCap='round';ctx.strokeStyle='rgba(90,50,35,.28)';ctx.lineWidth=3;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(-90+i*6,-150+i*26);ctx.quadraticCurveTo(0,-165+i*26,90-i*6,-150+i*26);ctx.stroke()}
for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(s*42,72);ctx.quadraticCurveTo(s*72,105,s*62,150);ctx.stroke()}
/* волосы по бокам */

/* брови */
const raise=P.raise;for(const s of[-1,1]){ctx.strokeStyle='#e6e3dc';ctx.lineWidth=4.5;for(let i=0;i<18;i++){const x=s*(30+i*4.4),y=-62-Math.sin(i/17*Math.PI)*10-raise*6+(s>0?d*3:0);L(x,y+9,x+s*7,y-5+Math.sin(i)*2)}ctx.strokeStyle='rgba(90,80,70,.4)';ctx.lineWidth=2;L(s*32,-52-raise*6,s*108,-56-raise*6)}
/* глаза */
for(const s of[-1,1]){const ex=s*78,ey=-12+(s>0?d*4:0);ctx.fillStyle='rgba(95,50,40,.28)';ctx.beginPath();ctx.ellipse(ex,ey+2,48,28,0,0,7);ctx.fill();
const oh=18*open;if(open>.07){ctx.save();ctx.beginPath();ctx.ellipse(ex,ey,34,oh,0,0,7);ctx.clip();ctx.fillStyle='#e9e1d1';ctx.fillRect(ex-40,ey-20,80,40);ctx.fillStyle=`rgba(190,60,50,${.12+d*.3})`;ctx.fillRect(ex-40,ey-20,80,40);
const lx=ex+Math.sin(t*.4+s)*3*(1+d*2)+s*d*3,ly=ey+Math.sin(t*.3)*2+d*3;g=ctx.createRadialGradient(lx,ly,2,lx,ly,15);g.addColorStop(0,'#7da0b2');g.addColorStop(1,'#3d5663');ctx.fillStyle=g;ctx.beginPath();ctx.arc(lx,ly,15,0,7);ctx.fill();ctx.fillStyle='#050505';ctx.beginPath();ctx.arc(lx,ly,6,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.arc(lx-5,ly-5,2.6,0,7);ctx.fill();
g=ctx.createLinearGradient(0,ey-oh,0,ey);g.addColorStop(0,'rgba(60,25,15,.6)');g.addColorStop(1,'rgba(60,25,15,0)');ctx.fillStyle=g;ctx.fillRect(ex-40,ey-oh,80,oh*.8);ctx.restore();ctx.strokeStyle='#5a3526';ctx.lineWidth=3.5;ctx.beginPath();ctx.ellipse(ex,ey,34,oh,0,Math.PI,0);ctx.stroke()}

ctx.strokeStyle='rgba(80,40,30,.4)';ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(ex,ey+4,38,24,0,.25,Math.PI-.25);ctx.stroke();ctx.beginPath();ctx.ellipse(ex,ey+8,40,26,0,.45,Math.PI-.45);ctx.stroke()}
/* нос */
ctx.strokeStyle='rgba(90,50,35,.3)';ctx.lineWidth=4;for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(s*16,-10);ctx.quadraticCurveTo(s*26,30,s*30,55);ctx.stroke()}
g=ctx.createRadialGradient(-8,50,4,0,58,40);g.addColorStop(0,'#e3a98a');g.addColorStop(1,`rgb(${190+d*20|0},${110-d*30|0},${95-d*25|0})`);ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,60,34,27,0,0,7);ctx.fill();ctx.fillStyle='rgba(50,20,15,.65)';for(const s of[-1,1]){ctx.beginPath();ctx.ellipse(s*14,76,7,4.5,s*.3,0,7);ctx.fill()}

ctx.beginPath();ctx.moveTo(-54,Ly);ctx.quadraticCurveTo(0,132,54,Ry);ctx.quadraticCurveTo(2,146+op*1.7,-54,Ly);ctx.closePath();
